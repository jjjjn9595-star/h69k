name: Build OpenWrt 25.12 H69K

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      openwrt_tag:
        description: OpenWrt tag to build
        required: true
        default: v25.12.4

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout build kit
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget python3 libelf-dev \
            ccache ecj fastjar java-propose-classpath zstd

      - name: Build firmware
        env:
          OPENWRT_TAG: ${{ inputs.openwrt_tag }}
          JOBS: 2
        run: |
          chmod +x scripts/*.sh
          ./scripts/build-openwrt-h69k.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-h69k-25.12
          path: artifacts/*
          if-no-files-found: error
